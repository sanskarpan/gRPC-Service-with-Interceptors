apiVersion: v1
kind: ConfigMap
metadata:
  name: grpc-service-config
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 50051
      max_conns: 100
      timeout: 30s
      max_recv_message_mb: 4
      max_send_message_mb: 4
      max_users: 10000
      max_stream_messages: 100
      max_string_bytes: 4096
      stream_interval: 2s
      rate_limit_per_second: 100
      rate_limit_burst: 200

    tls:
      enabled: true
      cert_file: "/app/certs/server.crt"
      key_file: "/app/certs/server.key"
      ca_file: "/app/certs/ca.crt"

    auth:
      jwt_secret: ""
      api_keys: []

    logging:
      level: "info"
      format: "json"

    tracing:
      enabled: false
      endpoint: ""
      service_name: "grpc-service"

    metrics:
      enabled: true
      port: 9090

    health:
      port: 8080
    storage:
      backend: "postgres"
      url: ""
      max_open_conns: 20
      max_idle_conns: 10
      conn_max_lifetime: 30m
      ping_timeout: 5s
      retry_attempts: 3
      retry_backoff: 250ms
      retry_max_backoff: 5s
    reflection: false
    client:
      address: "grpc-service:50051"
      server_name: "grpc-service"
      auth_token: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-service
  labels:
    app: grpc-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: grpc-service
  template:
    metadata:
      labels:
        app: grpc-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: grpc-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: grpc-service
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: grpc-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: grpc-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: grpc-service
        image: grpc-service:1.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - containerPort: 50051
          name: grpc
        - containerPort: 8080
          name: health
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          failureThreshold: 30
          periodSeconds: 2
        volumeMounts:
        - name: config
          mountPath: /app/configs/config.yaml
          subPath: config.yaml
        - name: tls
          mountPath: /app/certs
          readOnly: true
        - name: tmp
          mountPath: /tmp/grpc
        - name: run
          mountPath: /run
        env:
        - name: CONFIG_PATH
          value: "/app/configs/config.yaml"
        - name: TMPDIR
          value: "/tmp/grpc"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: grpc-service-auth
              key: jwt-secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: grpc-service-db
              key: url
      volumes:
      - name: config
        configMap:
          name: grpc-service-config
      - name: tls
        secret:
          secretName: grpc-service-tls
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-service
spec:
  type: ClusterIP
  ports:
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: health
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: grpc-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grpc-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grpc-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
