# External Secrets Operator (ESO) example — syncs secrets from an external
# manager (Vault / AWS Secrets Manager / GCP Secret Manager) into the two
# Kubernetes Secrets the Deployment already consumes via secretKeyRef. The app
# image and Deployment are unchanged: env-from-Secret is the stable seam.
#
# Prereqs: install ESO and create a ClusterSecretStore named "central-secrets"
# pointing at your backend. Then apply this manifest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grpc-service-auth
  namespace: grpc-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: central-secrets
  target:
    name: grpc-service-auth # the Secret the Deployment references
    creationPolicy: Owner
  data:
    - secretKey: jwt-public-key
      remoteRef:
        key: grpc-service/auth
        property: jwt_public_key
    - secretKey: api-keys
      remoteRef:
        key: grpc-service/auth
        property: api_keys
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grpc-service-db
  namespace: grpc-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: central-secrets
  target:
    name: grpc-service-db
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: grpc-service/db
        property: database_url
