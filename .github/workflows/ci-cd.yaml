name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: grpc-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22.14.0"
  COVERAGE_MIN: "45"
  GOLANGCI_LINT_VERSION: "v2.1.6"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify toolchain
        run: test "$(go version | awk '{print $3}')" = "go${GO_VERSION}"

      - name: Check gofumpt formatting
        run: |
          go install mvdan.cc/gofumpt@latest
          unformatted="$("$(go env GOPATH)/bin/gofumpt" -l . 2>/dev/null | grep -v vendor/ || true)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofumpt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./cmd/... ./internal/... ./pkg/...
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v actual="$coverage" -v minimum="$COVERAGE_MIN" 'BEGIN { if (actual < minimum) { printf "coverage %.1f%% is below %.1f%%\n", actual, minimum; exit 1 } }'

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.out
          retention-days: 7

      # Proto governance (lint + breaking-change detection) is handled by the
      # dedicated `proto` job via buf. Regeneration-drift checking via
      # `make proto-check` requires a protoc toolchain not present on this
      # runner, so it is intentionally not run here.

      - name: golangci-lint
        # Install from source so it is compiled with this job's Go toolchain.
        # The action's prebuilt binary for the pinned version is built with an
        # older Go than the module targets (go 1.26), which it refuses to lint.
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          "$(go env GOPATH)/bin/govulncheck" ./cmd/... ./internal/... ./pkg/...

      - name: Smoke fuzz tests
        # Run each fuzz target briefly and FAIL on a discovered crasher.
        # `go test -fuzz` accepts one target in one package at a time, so we
        # discover targets and run them individually instead of swallowing
        # errors with `|| true`.
        run: |
          set -euo pipefail
          found=0
          while IFS=: read -r file fn; do
            [ -z "$fn" ] && continue
            pkg="./$(dirname "$file")"
            target="${fn#func }"
            echo "fuzzing $target in $pkg"
            go test -run='^$' -fuzz="^${target}$" -fuzztime=10s "$pkg"
            found=1
          done < <(grep -rEl '^func Fuzz' --include='*_test.go' ./pkg ./internal 2>/dev/null \
                    | xargs -r grep -HoE '^func Fuzz[A-Za-z0-9_]+' | sed 's/(.*//')
          [ "$found" = 1 ] || echo "no fuzz targets found"

  integration:
    name: Postgres integration and E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grpc_service_test
          POSTGRES_USER: orpheus
          POSTGRES_PASSWORD: orpheus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              echo "Postgres ready"
              break
            fi
            sleep 1
          done
      - name: Run Postgres integration tests
        env:
          TEST_DATABASE_URL: "postgres://orpheus:orpheus@127.0.0.1:5432/grpc_service_test?sslmode=disable"
        run: |
          go test -race -count=1 -timeout=120s \
            -run 'TestPostgres' \
            ./internal/storage/...
      - name: Run E2E tests
        env:
          TEST_DATABASE_URL: "postgres://orpheus:orpheus@127.0.0.1:5432/grpc_service_test?sslmode=disable"
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 -timeout=300s \
            -run 'TestE2E' \
            ./cmd/server/...
      - name: Run retry unit tests
        env:
          TEST_DATABASE_URL: "postgres://orpheus:orpheus@127.0.0.1:5432/grpc_service_test?sslmode=disable"
        run: |
          go test -race -count=1 -timeout=60s \
            -run 'TestRetry|TestBackoff|TestIsRetryable' \
            ./internal/storage/...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Coverage
        # The frontend is an intentionally demo-mode UI with no test suite. Run
        # tests only if a `test` script exists (failing on real test failures);
        # otherwise report the absence explicitly rather than hiding it behind
        # `|| true`. typecheck/lint/build above are the enforced frontend gates.
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test?0:1)"; then
            npm test -- --coverage --coverageReporters=text-summary --passWithNoTests
          else
            echo "frontend has no test script (demo-mode UI); typecheck, lint and build gate it"
          fi
      # Block on critical advisories. The demo frontend's remaining high
      # advisories are transitive build-toolchain issues (postcss/dompurify via
      # next) whose only fixes are breaking; Dependabot tracks the upgrades.
      - run: npm audit --omit=dev --audit-level=critical

  manifests:
    name: Manifest validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate K8s manifests parse
        run: |
          for f in test/deployment/k8s/*.yaml; do
            echo "checking $f"
            awk 'BEGIN{ok=1} /^---$/{if(ok) print "ok"; ok=1; doc=""; next} {doc=doc $0 "\n"} END{if(ok && doc!="") print "ok"}' "$f"
          done
          python3 -c "
          import sys, yaml
          files = [
            'test/deployment/k8s/deployment.yaml',
            'test/deployment/k8s/poddisruptionbudget.yaml',
            'test/deployment/k8s/networkpolicy.yaml',
            'test/deployment/k8s/serviceaccount.yaml',
            'docker-compose.yaml',
          ]
          for f in files:
              with open(f) as h:
                  list(yaml.safe_load_all(h))
              print(f, 'parses cleanly')
          "
      - name: Validate Prometheus alerting rules
        run: |
          PROM_VERSION=3.1.0
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp
          PROMTOOL="/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool"
          "$PROMTOOL" check rules test/deployment/prometheus/alerting-rules.yml
          cd test/deployment/prometheus && "$PROMTOOL" test rules alerting-rules_test.yml

  proto:
    name: Proto lint and breaking-change check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: true
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main"

  container:
    name: Container build and scan
    runs-on: ubuntu-latest
    needs: [backend, frontend, manifests]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: grpc-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke run
        run: |
          docker run --rm --read-only --tmpfs /tmp/grpc:rw,nosuid,nodev,size=32m \
            -p 8080:8080 \
            -e TLS_ENABLED=false \
            -e JWT_SECRET=ci-smoke-secret-not-for-prod-0123456789 \
            -e AUTH_API_KEYS=ci-smoke-api-key-not-for-prod \
            -e METRICS_ENABLED=false \
            grpc-service:ci &
          pid=$!
          for i in {1..30}; do
            if curl -sf --max-time 5 http://127.0.0.1:8080/healthz >/dev/null; then
              echo "healthz ok"
              break
            fi
            sleep 1
          done
          curl -sS --max-time 5 http://127.0.0.1:8080/healthz
          kill "$pid" || true
          wait "$pid" || true

      - name: Scan image
        # Install Trivy from its official script rather than pinning an action
        # tag that can be un-published (as 0.28.0 was); fail on CRITICAL/HIGH.
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            grpc-service:ci

  publish:
    name: Publish signed image (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, manifests, container, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign + provenance OIDC
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push (multi-arch, with SBOM + provenance)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container image references must be lowercase; github.repository can be
      # mixed-case, so derive a lowercase name for cosign and the attestation.
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Sign the image (keyless cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ steps.img.outputs.name }}@${DIGEST}"

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Tag main release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, manifests, container, integration, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            version="v0.1.0"
          else
            version="$(echo "$latest" | awk -F. '{printf "%s.%s.%d\n", $1, $2, $3 + 1}')"
          fi
          git tag "$version" "$GITHUB_SHA"
          git push origin "$version"
