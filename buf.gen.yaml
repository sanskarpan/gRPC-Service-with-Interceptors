version: v2
managed:
  enabled: false
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/example/grpc-service
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/example/grpc-service
  - local: protoc-gen-grpc-gateway
    out: .
    opt: module=github.com/example/grpc-service
