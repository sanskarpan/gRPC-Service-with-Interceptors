# MkDocs configuration for the gRPC Service documentation site.
#
# The site is built entirely from the markdown in docs/. Build locally with:
#
#     pip install mkdocs-material
#     mkdocs serve      # live preview at http://127.0.0.1:8000
#     mkdocs build      # emit the static site into ./site
#
# CI builds and deploys this to GitHub Pages via .github/workflows/docs.yml.
site_name: gRPC Service with Interceptors
site_description: >-
  Authenticated Go gRPC service with bounded request handling, TLS/mTLS,
  structured logs, Prometheus metrics, OpenTelemetry tracing, health probes,
  circuit breaking, per-client rate limiting and PostgreSQL persistence.
site_author: sanskarpan
repo_url: https://github.com/sanskarpan/gRPC-Service-with-Interceptors
repo_name: sanskarpan/gRPC-Service-with-Interceptors
edit_uri: edit/main/docs/

# All markdown sources live in docs/.
docs_dir: docs

# Some docs intentionally link to repo-root files (../README.md, ../CHANGELOG.md)
# so they render on GitHub too. Those targets live outside docs_dir and can't
# resolve inside the built site, so cross-boundary link checks are downgraded to
# non-fatal while --strict still catches a genuinely broken nav entry.
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Installation: getting-started/installation.md
      - Docker & Compose: getting-started/docker-compose.md
  - Architecture:
      - Overview: architecture/overview.md
      - Request lifecycle: architecture/request-lifecycle.md
      - Storage backends: architecture/storage.md
  - Reference:
      - Configuration: reference/configuration.md
      - API & RPCs: reference/api.md
      - Error codes: reference/error-codes.md
  - Operations:
      - Deployment: operations/deployment.md
      - Runbook: operations/runbook.md
      - Observability: operations/observability.md
      - Security model: operations/security.md
  - Contributing:
      - Contributing guide: contributing/contributing.md
      - Versioning & compatibility: contributing/versioning.md
  - Design & decisions:
      - ADR index: adr/README.md
      - ADR-0001 Transport & authentication: adr/0001-transport-and-authentication.md
      - ADR-0002 Bounded memory backend: adr/0002-bounded-memory-backend.md
      - ADR-0003 Observability & health: adr/0003-observability-and-health.md
      - ADR-0004 Build & deployment policy: adr/0004-build-and-deployment-policy.md
      - ADR-0005 No browser gateway: adr/0005-no-browser-gateway.md
  - FAQ: faq.md
