syntax = "proto3";

package example.v1;

option go_package = "github.com/example/grpc-service/pkg/pb;pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

service UserService {
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }

  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      put: "/v1/users/{id}"
      body: "*"
    };
  }

  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/users/{id}"
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  rpc StreamUserEvents(StreamUserEventsRequest) returns (stream UserEvent) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/events"
    };
  }

  rpc CollectUserMetrics(stream UserMetric) returns (CollectMetricsResponse) {
    option (google.api.http) = {
      post: "/v1/metrics"
      body: "*"
    };
  }

  rpc ChatStream(stream ChatMessage) returns (stream ChatMessage) {
    option (google.api.http) = {
      post: "/v1/chat"
      body: "*"
    };
  }
}

message GetUserRequest {
  string id = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  int32 age = 3;
  // Optional idempotency key. When set, retrying CreateUser with the same key
  // returns the originally created user instead of creating a duplicate.
  string idempotency_key = 4;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string email = 3;
  int32 age = 4;
}

message DeleteUserRequest {
  string id = 1;
}

message ListUsersRequest {
  // Maximum users to return. Clamped to a server maximum; 0 means the default.
  int32 page_size = 1;
  // Opaque continuation token from a previous ListUsersResponse. Empty starts
  // from the beginning.
  string page_token = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  // Token to pass as page_token for the next page. Empty when no more results.
  string next_page_token = 2;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  int32 age = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message UserEvent {
  string user_id = 1;
  string event_type = 2;
  string payload = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message StreamUserEventsRequest {
  string user_id = 1;
  repeated string event_types = 2;
}

message UserMetric {
  string user_id = 1;
  string metric_name = 2;
  double value = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message CollectMetricsResponse {
  int32 count = 1;
  double sum = 2;
  double avg = 3;
}

message ChatMessage {
  string id = 1;
  string user_id = 2;
  string message = 3;
  google.protobuf.Timestamp timestamp = 4;
}
